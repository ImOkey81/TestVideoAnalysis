version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - APP_PORT=5000
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=8080
      - POSTGRES_DB=test_platform
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
